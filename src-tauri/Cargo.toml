[package]
name = "illutag"
version = "1.13.3"
edition = "2021"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "illutag_core"
path = "src/lib.rs"

[dependencies]
arboard = "3.4"
calamine = "0.26"
image = { version = "0.25", default-features = false, features = ["avif", "bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ts-rs = { version = "12", features = ["serde-json-impl"] }
tauri = { version = "=2.11.2", features = ["protocol-asset"] }
tauri-plugin-dialog = "=2.7.1"
trash = "5"
walkdir = "2"
webp = "0.3.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
